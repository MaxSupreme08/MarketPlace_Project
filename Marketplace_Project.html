<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIPS Marketplace</title>
</head>
<body>

  <!-- 1. HEADER / NAVBAR -->
  <header>
    <div class="logo">
      <h1>IIPS Marketplace</h1>
    </div>
    <nav>
      <button id="openFormBtn">+ Create New Listing</button>
      <button id="viewManagerBtn">Manager Dashboard (<span id="pendingCount">0</span>)</button>
      <button id="Deletealisting">Request Delete a Listing</button>
    </nav>
  </header>

  <main>
    <!-- 2. LIVE MARKETPLACE SECTION (Blog-Style Grid) -->
    <section id="marketplaceSection">
      <h2>Live Listings</h2>
      <div id="listingsContainer">
        <!-- Live items will be rendered here dynamically later -->
      </div>
    </section>

    <!-- 3. MANAGER REVIEW DASHBOARD SECTION -->
    <section id="managerSection" hidden>
      <h2>Manager Approval Queue</h2>
      <p>Review submitted listings before they appear on the main campus feed.</p>
      <div id="pendingListingsContainer">
        <!-- Submissions waiting for review will appear here -->
      </div>
    </section>
  </main>

  <!-- 4. MODAL FORM FOR SELLER LISTING -->
  <dialog id="listingModal">
    <div>
      <header>
        <h3>Create New Listing</h3>
        <button id="closeModalBtn">&times;</button>
      </header>

      <form id="listingForm">
        <!-- Seller Info Section -->
        <fieldset>
          <legend>Seller Information</legend>
          
          <label for="sellerName">Full Name:</label>
          <input type="text" id="sellerName" name="sellerName" placeholder="e.g., Anshu Sharma" required>

          <label for="sellerPhoto">Seller Photo URL (or Image Link):</label>
          <input type="url" id="sellerPhoto" name="sellerPhoto" placeholder="https://..." required>

          <label for="phone">Phone Number (Calls):</label>
          <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required>

          <label for="whatsapp">WhatsApp Number:</label>
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="+91 9876543210" required>
        </fieldset>

        <!-- Product Details Section -->
        <fieldset>
          <legend>Product Details</legend>

          <label for="title">Product Title:</label>
          <input type="text" id="title" name="title" placeholder="e.g., Casio Scientific Calculator / Engineering Textbooks" required>

          <label for="price">Price (₹):</label>
          <input type="number" id="price" name="price" placeholder="500" min="0" required>

          <label for="productPhoto">Product Image URL:</label>
          <input type="url" id="productPhoto" name="productPhoto" placeholder="https://..." required>

          <label for="usage">Usage / Condition:</label>
          <select id="usage" name="usage" required>
            <option value="">Select Condition</option>
            <option value="Like New (Barely Used)">Like New (Barely Used)</option>
            <option value="Good (Slight Wear)">Good (Slight Wear)</option>
            <option value="Fair (Well Used)">Fair (Well Used)</option>
          </select>

          <label for="warranty">Warranty Details:</label>
          <input type="text" id="warranty" name="warranty" placeholder="e.g., 6 months company warranty left / No warranty" required>

          <label for="description">Product Description:</label>
          <textarea id="description" name="description" rows="4" placeholder="Mention features, reason for selling, pickup location in campus, etc." required></textarea>
        </fieldset>

        <footer>
          <button type="button" id="cancelFormBtn">Cancel</button>
          <button type="submit">Submit for Approval</button>
        </footer>
      </form>
    </div>
  </dialog>

</body>
</html>
